<!--Shows the sign-up form and runs JS validation before submission-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Create Account</h2>

    <form action="register.php" method="post" onsubmit="return validateRegisterForm();">

        <input type="text" name="username" id="username" placeholder="Username" required>

        <input type="email" name="email" id="email" placeholder="Email" required>

        <input type="password" name="password" id="password" placeholder="Password" required>

        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account? <a href="login.html">Log in</a></p>

</div>

<script>
    function validateRegisterForm() {
        let username = document.getElementById("username").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirm_password").value;

        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (username.length < 6) {
            alert("Username must be at least 6 characters long.");
            return false;
        }

        if (!emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            return false;
        }

        if (password.length < 8 || !/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
            alert("Password must be at least 8 characters and include uppercase, lowercase, and a number.");
            return false;
        }

        if (password !== confirmPassword) {
            alert("Password and Confirm Password must match.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
